name: Pull request tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Test
        working-directory: source
        run: dotnet test
